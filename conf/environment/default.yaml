reward:
  rmse_weight: 1.0
  borehole_weight: 0.1
  initial_rmse: 5.0
  use_initial_rmse_placeholder: true
pool: data/field_pool_train_qc.npy
observation:
  mode: full_observed_map # Canonical 3D representation shared by MLP and future CNN encoders.
  representation: mlp
  field_shape: [101, 101, 21]
  include_position: true
  unknown_value: 0.0
  value_low: 0.0
  value_high: 300.0
initial_position: [0, 50]
max_holes: 7
eval_pool: data/field_pool_eval_qc.npy
