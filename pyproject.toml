[project]
name = "drill-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cuongafg", email = "cuongafg@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gempy>=2026.0.3",
    "gymnasium>=1.3.0",
    "hydra-core>=1.3.7",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scipy>=1.17.1",
    "stable-baselines3>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
drill-rl = "drill_rl:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
