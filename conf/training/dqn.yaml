algorithm: dqn
policy: MlpPolicy
total_timesteps: 200000
verbose: 1
model_name: DQN_baseline
parameters:
  learning_rate: 0.0001
  buffer_size: 100000
  learning_starts: 100
  batch_size: 32
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 10000
  exploration_fraction: 0.1
  exploration_final_eps: 0.05
